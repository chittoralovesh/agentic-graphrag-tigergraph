<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8178"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f8f6a"/>
    </marker>
  </defs>

  <rect width="1040" height="760" fill="#fbfaf9"/>

  <text x="36" y="44" font-size="23" font-weight="600" fill="#1c1a17">Agentic GraphRAG on TigerGraph</text>
  <text x="36" y="68" font-size="14" fill="#6b6560">Three pipelines, one corpus, one synthesis step — the only variable is how evidence is gathered.</text>

  <!-- corpus -->
  <rect x="36" y="92" width="968" height="56" rx="9" fill="#fff" stroke="#e5e1dc"/>
  <text x="52" y="116" font-size="13" font-weight="600" fill="#1c1a17">Corpus · 2,951 Wikipedia documents</text>
  <text x="52" y="136" font-size="12" fill="#6b6560">2,162 Olympic events (machine-readable infobox) + 789 distractors (546 films, politicians, companies)</text>
  <text x="820" y="124" font-size="12" fill="#6b6560">16,528 chunks</text>

  <!-- dual ingestion -->
  <path d="M300 148 L300 178" stroke="#8a8178" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M740 148 L740 178" stroke="#8a8178" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="310" y="170" font-size="11" fill="#6b6560">infobox → typed graph</text>
  <text x="750" y="170" font-size="11" fill="#6b6560">prose → chunks + vectors</text>

  <!-- pipelines -->
  <g>
    <rect x="36" y="190" width="300" height="172" rx="9" fill="#fff" stroke="#b4654a" stroke-width="1.6"/>
    <text x="54" y="216" font-size="14" font-weight="600" fill="#b4654a">1 · RAG</text>
    <text x="54" y="240" font-size="12" fill="#1c1a17">single similarity retrieval</text>
    <text x="54" y="262" font-size="12" fill="#6b6560">top-k → stuff context → generate</text>
    <text x="54" y="288" font-size="12" fill="#6b6560">no graph · no iteration</text>
    <rect x="54" y="302" width="264" height="42" rx="6" fill="#faf4f1"/>
    <text x="66" y="320" font-size="11.5" font-weight="600" fill="#b4654a">58 / 100</text>
    <text x="66" y="337" font-size="11" fill="#6b6560">2,002 tokens/q · 0/21 on aggregation</text>
  </g>

  <g>
    <rect x="370" y="190" width="300" height="172" rx="9" fill="#fff" stroke="#4a7ab4" stroke-width="1.6"/>
    <text x="388" y="216" font-size="14" font-weight="600" fill="#4a7ab4">2 · GraphRAG</text>
    <text x="388" y="240" font-size="12" fill="#1c1a17">fixed four-stage plan</text>
    <text x="388" y="262" font-size="12" fill="#6b6560">classify → link → retrieve → answer</text>
    <text x="388" y="288" font-size="12" fill="#6b6560">same graph access, no adaptivity</text>
    <rect x="388" y="302" width="264" height="42" rx="6" fill="#f1f5fa"/>
    <text x="400" y="320" font-size="11.5" font-weight="600" fill="#4a7ab4">95 / 100</text>
    <text x="400" y="337" font-size="11" fill="#6b6560">850 tokens/q · more accurate AND cheaper</text>
  </g>

  <g>
    <rect x="704" y="190" width="300" height="172" rx="9" fill="#fff" stroke="#3f8f6a" stroke-width="1.6"/>
    <text x="722" y="216" font-size="14" font-weight="600" fill="#3f8f6a">3 · Agentic GraphRAG</text>
    <text x="722" y="240" font-size="12" fill="#1c1a17">orchestrator decides each step</text>
    <text x="722" y="262" font-size="12" fill="#6b6560">plan → act → judge → re-plan → stop</text>
    <text x="722" y="288" font-size="12" fill="#6b6560">next move depends on what came back</text>
    <rect x="722" y="302" width="264" height="42" rx="6" fill="#f0f7f4"/>
    <text x="734" y="320" font-size="11.5" font-weight="600" fill="#3f8f6a">recovers ambiguous retrievals</text>
    <text x="734" y="337" font-size="11" fill="#6b6560">stops as soon as evidence settles</text>
  </g>

  <!-- agent loop detail -->
  <rect x="704" y="378" width="300" height="150" rx="9" fill="#f7fbf9" stroke="#cfe3d9"/>
  <text x="722" y="400" font-size="12" font-weight="600" fill="#3f8f6a">the loop</text>
  <g font-size="11" fill="#1c1a17">
    <text x="722" y="422">orchestrator — picks ONE action + why</text>
    <text x="722" y="442">specialist tool — entity link · traverse ·</text>
    <text x="736" y="459">vector search · count · argmax · edition hop</text>
    <text x="722" y="479">evidence critic — sufficient? what's missing?</text>
  </g>
  <text x="722" y="501" font-size="11" fill="#6b6560">skipped after a tool that scans a whole group:</text>
  <text x="722" y="517" font-size="11" fill="#6b6560">those results are self-validating</text>
  <path d="M712 486 C700 470 700 420 712 412" stroke="#3f8f6a" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>

  <!-- arrows to store -->
  <path d="M186 362 L186 564" stroke="#8a8178" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M520 362 L520 564" stroke="#8a8178" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M854 528 L854 564" stroke="#8a8178" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- tigergraph -->
  <rect x="36" y="572" width="968" height="156" rx="9" fill="#fff" stroke="#e5e1dc" stroke-width="1.6"/>
  <text x="54" y="597" font-size="14" font-weight="600" fill="#1c1a17">TigerGraph 4.2.5 · Savanna</text>

  <g font-size="11.5" fill="#1c1a17">
    <text x="54" y="622">Games —HAS_EVENT→ OlympicEvent</text>
    <text x="54" y="643">OlympicEvent —OF_SPORT→ Sport</text>
    <text x="54" y="664">OlympicEvent —AT_VENUE→ Venue</text>
    <text x="54" y="685">OlympicEvent —WON_GOLD/SILVER/BRONZE→ Athlete —REPRESENTS→ NOC</text>
    <text x="54" y="706">OlympicEvent —SOURCED_FROM→ Document —HAS_CHUNK→ Chunk</text>
  </g>

  <rect x="560" y="606" width="200" height="46" rx="6" fill="#f5f2fa" stroke="#ddd4ea"/>
  <text x="572" y="625" font-size="11.5" font-weight="600" fill="#5b4a8f">OlympicEvent ⇄ PREV/NEXT_EDITION</text>
  <text x="572" y="642" font-size="11" fill="#6b6560">temporal spine · 1,665 edges</text>

  <rect x="560" y="662" width="200" height="46" rx="6" fill="#f0f7f4" stroke="#cfe3d9"/>
  <text x="572" y="681" font-size="11.5" font-weight="600" fill="#3f8f6a">Chunk.embedding · TigerVector</text>
  <text x="572" y="698" font-size="11" fill="#6b6560">HNSW · cosine · 768-dim</text>

  <g font-size="11" fill="#6b6560">
    <text x="790" y="625">2,951 Document</text>
    <text x="790" y="643">2,162 OlympicEvent</text>
    <text x="790" y="661">5,981 Athlete · 298 Venue</text>
    <text x="790" y="679">133 NOC · 21 Games · 41 Sport</text>
    <text x="790" y="697">16,528 Chunk</text>
  </g>

  <!-- finding -->
  <rect x="36" y="378" width="634" height="150" rx="9" fill="#fff" stroke="#e5e1dc"/>
  <text x="54" y="400" font-size="12.5" font-weight="600" fill="#1c1a17">The finding — measured with no LLM involved</text>
  <text x="54" y="420" font-size="11.5" fill="#6b6560">Complete retrieval = every supporting document inside top-k. For a count, partial recall is worth nothing.</text>

  <g font-size="11" fill="#1c1a17">
    <text x="54" y="448" font-weight="600">question type</text>
    <text x="210" y="448" font-weight="600">docs needed</text>
    <text x="320" y="448" font-weight="600">complete@5</text>
    <text x="440" y="448" font-weight="600">RAG accuracy</text>

    <text x="54" y="469">lookup</text><text x="210" y="469">1.0</text>
    <text x="320" y="469">100%</text><text x="440" y="469">89%</text>

    <text x="54" y="488">multi-hop / temporal</text><text x="210" y="488">1–2</text>
    <text x="320" y="488">59–89%</text><text x="440" y="488">73–82%</text>

    <text x="54" y="509" fill="#c0392b" font-weight="600">aggregation</text><text x="210" y="509">15.1</text>
    <text x="320" y="509" fill="#c0392b" font-weight="600">0%</text><text x="440" y="509" fill="#c0392b" font-weight="600">0 / 21</text>
  </g>
  <text x="560" y="509" font-size="11" fill="#6b6560">31 of 100 questions are</text>
  <text x="560" y="523" font-size="11" fill="#6b6560">unanswerable by top-k</text>
</svg>
